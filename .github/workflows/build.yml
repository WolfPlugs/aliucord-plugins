name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: src

      - name: Checkout builds
        uses: actions/checkout@v7
        with:
          ref: builds
          path: builds

      - name: Set up JDK 21 compiler
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-31" "build-tools;30.0.2" "platform-tools"

      - name: Build plugins
        working-directory: src
        run: |
          bash gradlew make generateUpdaterJson --no-daemon \
            -Porg.gradle.java.installations.paths="$JAVA_HOME_21_X64"
          cp GlobalBadges/build/*.zip clapclap/build/*.zip "$GITHUB_WORKSPACE/builds/"
          cp build/updater.json "$GITHUB_WORKSPACE/builds/"

      - name: Push builds
        working-directory: builds
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add GlobalBadges.zip clapclap.zip updater.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:builds
